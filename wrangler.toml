name = "activateme-assistant"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Serves public/chat-widget.js and public/demo.html for free from Cloudflare's edge.
[assets]
directory = "./public"

# Lets the worker import knowledge.md as a plain string.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Cloudflare Workers AI — free daily allowance, no API key needed.
[ai]
binding = "AI"

# Per-visitor rate limit on /chat (free, built into Workers): 10 messages a minute per IP.
# A person chatting never hits it; a script hammering the bot gets cut off before it eats the daily AI quota.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
# "workers-ai" (default, no extra account) or "gemini" (needs: npx wrangler secret put GEMINI_API_KEY)
PROVIDER = "workers-ai"
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GEMINI_MODEL = "gemini-2.5-flash"
# Comma-separated sites allowed to call /chat from a browser.
ALLOWED_ORIGINS = "https://www.activatemefest.com,https://activatemefest.com"
# Utter (utterchat.ai) widget IDs the worker may fetch WhatsApp handoff config for (GET /handoff-config).
# ActivateMe, mwanevents.com, mwanmobile.com.
UTTER_WIDGET_IDS = "695222f369041029ef96ba3a,66d9a6743280355ad15f0f23,6a26757462a89e993ebaeac6"
